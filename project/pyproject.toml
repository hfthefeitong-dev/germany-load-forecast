[project]
name = "loadfc"
version = "0.1.0"
description = "Day-ahead electricity load forecasting for Germany, benchmarked against the official TSO forecast"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow",
    "numpy",
    "lightgbm>=4",
    "matplotlib",
    "requests",
    "holidays",
    "scipy",
    "tabulate",  # markdown tables in reports/RESULTS.md
]

[project.optional-dependencies]
# Chronos-2 needs PyTorch and, in practice, a CUDA GPU.
foundation = ["chronos-forecasting>=2.0"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
